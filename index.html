<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <!--
      内容安全策略：零外链是硬约定，因此 `default-src 'self'` 直接封死
      任何 CDN / 外链图片 / 图标字体。
      `style-src` 需要 'unsafe-inline'：SolidJS 的组件样式与设计令牌
      以元素级 style 属性下发，这在本地离线应用里是可控风险。
      `connect-src` 允许 ipc: 与 http://ipc.localhost，这是 Tauri 2
      在 Windows / macOS 上传递 IPC 的传输层地址。
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self'; connect-src 'self' ipc: http://ipc.localhost"
    />
    <title>羽化写作</title>
    <!--
      应用图标用内联 SVG data URI 而不是外链 .ico：
      避免额外一次网络请求，也让「零外链」在页面层面可验证。
    -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%232B6B5F' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M12 2.6 C15.2 5.6 16.6 9.2 15.9 12.6 C15.2 15.9 13.4 18.4 12 19.2 C10.6 18.4 8.8 15.9 8.1 12.6 C7.4 9.2 8.8 5.6 12 2.6 Z'/%3E%3Cpath d='M12 2.6 C12.1 9 12 15.4 11.8 21.6'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <!--
      首屏骨架：在 JS 解析完成前先画出应用底色与品牌标记，
      避免白屏闪烁（要求②关注的冷启动观感）。
      Solid 挂载时会整体替换 #root 的内容。
    -->
    <div id="root">
      <div class="boot">
        <div class="boot__mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2.6 C15.2 5.6 16.6 9.2 15.9 12.6 C15.2 15.9 13.4 18.4 12 19.2 C10.6 18.4 8.8 15.9 8.1 12.6 C7.4 9.2 8.8 5.6 12 2.6 Z"/>
            <path d="M12 2.6 C12.1 9 12 15.4 11.8 21.6"/>
          </svg>
        </div>
        <p class="boot__text">正在载入羽化写作</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
